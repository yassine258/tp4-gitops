apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-alerts
spec:
  groups:
    - name: argocd
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: "{{ $labels.name }} (ns {{ $labels.dest_namespace }}) has been Degraded for more than 2 minutes. Check pod events or roll back."
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: "{{ $labels.name }} has not matched Git for more than 2 minutes (auto-sync disabled, sync error or manual rollback)."
        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[5m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD sync failed for {{ $labels.name }}"
    - name: workloads
      rules:
        - alert: PodImagePullOrCrashLoop
          # max by(...) gives one series per container, so the 'for' timer
          # doesn't reset when the reason flips between ErrImagePull and ImagePullBackOff.
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|CrashLoopBackOff"}
            ) == 1
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is stuck (image pull or crash loop)"
            description: "Container {{ $labels.container }} has been waiting in ErrImagePull/ImagePullBackOff/CrashLoopBackOff for more than 1 minute."
        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace=~"demo-.*"} > 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replicas"
