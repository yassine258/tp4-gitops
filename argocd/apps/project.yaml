# Least privilege: workloads can only come from this repo and land in the demo-* namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tp4
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: TP4 demo workloads
  sourceRepos:
    - https://github.com/yassine258/tp4-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
