apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
labels:
  - pairs:
      env: dev
# Demo 1 (auto CD): change replicas or newTag below, commit, push.
# Demo 3 (Synced but Degraded): set newTag to a tag that doesn't exist, e.g. v9.9.9
replicas:
  - name: demo-app
    count: 4
images:
  - name: quay.io/brancz/prometheus-example-app
    newTag: v9.9.9
